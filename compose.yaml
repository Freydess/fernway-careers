services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: employment
      POSTGRES_USER: employment
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a separate database password in .env}
    volumes:
      - employment_pg:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U employment -d employment']
      interval: 5s
      timeout: 5s
      retries: 10
  migrate:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://employment:${POSTGRES_PASSWORD}@db:5432/employment
    command: [python, -m, alembic, upgrade, head]
    depends_on:
      db:
        condition: service_healthy
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://employment:${POSTGRES_PASSWORD}@db:5432/employment
    ports:
      - '127.0.0.1:8000:8000'
    depends_on:
      migrate:
        condition: service_completed_successfully
  worker:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://employment:${POSTGRES_PASSWORD}@db:5432/employment
    command: [python, -m, app.worker]
    depends_on:
      migrate:
        condition: service_completed_successfully
volumes:
  employment_pg:
